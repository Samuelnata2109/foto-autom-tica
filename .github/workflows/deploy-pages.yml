name: Publicar AI Photo Booth no GitHub Pages

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preparar modelo de gestos
        run: npm run setup:gesture-model
      - name: Compilar para o GitHub Pages
        run: npm run build -- --mode github-pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PHOTO_SHARE_BASE_URL: https://samuelnata2109.github.io/foto-autom-tica/
      - name: Verificar recursos de IA no artefato
        run: |
          test -s dist/models/gesture_recognizer.task
          test -s dist/models/selfie_segmenter.tflite
          test -s dist/mediapipe/wasm/vision_wasm_module_internal.js
          test -s dist/mediapipe/wasm/vision_wasm_module_internal.wasm
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
